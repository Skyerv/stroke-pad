<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff7cbb">
  <title>StrokePad — Hanzi Practice Sheets</title>
</head>
<body>
  <div class="titlebar">
    <a class="title" href="/" title="Back to home">♥ StrokePad</a>
    <div class="window-controls" aria-hidden="true">
      <span class="fake-btn">–</span>
      <span class="fake-btn">□</span>
      <span class="fake-btn">✕</span>
    </div>
  </div>

  <main class="app">
    <span class="deco deco-star deco-star-1" aria-hidden="true">✦</span>
    <span class="deco deco-heart deco-heart-1" aria-hidden="true">♥</span>
    <span class="deco deco-star deco-star-2" aria-hidden="true">✧</span>

    <header class="app-header">
      <p class="eyebrow">♡ Study Mode ♡</p>
      <h1>Hanzi Practice Sheet Generator</h1>
      <p class="subtitle">Pick an HSK lesson or paste your own hanzi, then print a practice sheet. ⋆｡°✩</p>
    </header>

    <div class="layout">
      <section class="panel controls-panel">
        <div class="lesson-selector">
          <div class="selector-field">
            <label for="hsk-book">Book</label>
            <select id="hsk-book"></select>
          </div>
          <div class="selector-field">
            <label for="hsk-lesson">Lesson</label>
            <select id="hsk-lesson"></select>
          </div>
        </div>

        <label for="text-input">Hanzi list</label>
        <textarea id="text-input" placeholder="安装, 岸, 暗, 熬夜, 把握, 摆"></textarea>

        <div class="controls">
          <label for="practice-rows">Practice rows</label>
          <input id="practice-rows" type="number" min="1" max="8" value="2">
        </div>

        <div class="button-row">
          <button id="generate-btn" class="generate-btn" type="button">✿ Generate ✿</button>
          <button id="print-btn" class="ghost-btn" type="button" disabled>🖨 Print / Save PDF</button>
          <button id="share-btn" class="ghost-btn" type="button">🔗 Copy link</button>
        </div>

        <p id="status" class="status">Loading…</p>
      </section>

      <section class="panel preview-panel">
        <div class="preview-label">Preview</div>
        <iframe id="preview" class="preview-frame" title="Worksheet preview"></iframe>
      </section>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
