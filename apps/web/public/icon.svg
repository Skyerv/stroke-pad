  <path d="M11 3 H21 V25 L16 31 L11 25 Z" fill="#c85fa5"/>
  <!-- eraser -->
  <rect x="12" y="4" width="8" height="3" fill="#ff9ec2"/>
  <rect x="12" y="4" width="2" height="3" fill="#ffc2da"/>
  <!-- ferrule (metal band) -->
  <rect x="12" y="7" width="8" height="2" fill="#cdbcf0"/>
  <rect x="12" y="8" width="8" height="1" fill="#a98fd6"/>
  <!-- yellow body with highlight + shadow stripes -->
  <rect x="12" y="9" width="8" height="14" fill="#ffcf5a"/>
  <rect x="12" y="9" width="2" height="14" fill="#ffe089"/>
  <rect x="18" y="9" width="2" height="14" fill="#f2b53f"/>
  <!-- wood cone -->
  <path d="M12 23 H20 L16 30 Z" fill="#f0cd94"/>
  <path d="M16 23 H20 L16 30 Z" fill="#e2ba7c"/>
  <!-- graphite tip -->
  <path d="M14 27 H18 L16 31 Z" fill="#4a3d59"/>
</svg>
